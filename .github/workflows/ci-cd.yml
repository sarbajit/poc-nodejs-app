name: Node.js CI - Nexus & GHCR

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: [self-hosted, nodejs-runner]
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set Nexus npm auth (WINDOWS)
        shell: powershell
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          $authB64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("$($env:NEXUS_USERNAME):$($env:NEXUS_PASSWORD)"))
          # The base64 form is not auto-masked like the raw secret - mask it in logs
          Write-Host "::add-mask::$authB64"
          "NEXUS_NPM_AUTH=$authB64" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install dependencies (from Nexus) and package artifact
        shell: powershell
        run: |
          Write-Host "npm registry: $(npm config get registry)"
          npm ci --loglevel http    # 'http' level logs each fetch URL - should all be Nexus
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm pack
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # docker/login-action passes the password to docker directly (no PowerShell
      # pipe), so no BOM/encoding bytes get added to it. Registry = host:port, no http://
      - name: Login to Nexus Docker (pull - docker-group 8083)
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.NEXUS_HOST }}:8083
          username: ${{ secrets.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Login to Nexus Docker (push - docker-hosted 8082)
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.NEXUS_HOST }}:8082
          username: ${{ secrets.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push image to Nexus and GHCR (WINDOWS)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tag        = "${{ github.sha }}"
          $owner      = "${{ github.repository_owner }}".ToLower()   # GHCR requires lowercase
          $nexusImage = "${{ secrets.NEXUS_HOST }}:8082/nodejs-poc:$tag"
          $ghcrImage  = "ghcr.io/$owner/nodejs-poc:$tag"

          # Auth goes in as a BuildKit secret (read from env NEXUS_NPM_AUTH): available to npm ci, never stored in an image layer
          docker build --build-arg NEXUS_HOST="${{ secrets.NEXUS_HOST }}" `
            --secret "id=npm_auth,env=NEXUS_NPM_AUTH" `
            -t $nexusImage -t $ghcrImage .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          docker push $nexusImage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          docker push $ghcrImage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }