name: Node.js CI - Nexus & GHCR

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: [self-hosted, nodejs-runner]
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      # - name: Configure npm registry to Nexus npm-group (LINUX)
      #   run: |
      #     AUTH_B64=$(printf '%s:%s' "${{ secrets.NEXUS_USERNAME }}" "${{ secrets.NEXUS_PASSWORD }}" | base64 | tr -d '\n')
      #     npm config set registry "http://${{ secrets.NEXUS_HOST }}:8081/repository/npm-group/"
      #     npm config set "//${{ secrets.NEXUS_HOST }}:8081/repository/npm-group/:_auth" "$AUTH_B64"
      #     npm config set "//${{ secrets.NEXUS_HOST }}:8081/repository/npm-hosted/:_auth" "$AUTH_B64"

      - name: Configure npm registry to Nexus npm-group (WINDOWS)
        shell: powershell
        run: |
          $rawAuth = "${{ secrets.NEXUS_USERNAME }}:${{ secrets.NEXUS_PASSWORD }}"
          $authB64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($rawAuth))
          npm config set registry "http://${{ secrets.NEXUS_HOST }}:8081/repository/npm-group/"
          npm config set "//${{ secrets.NEXUS_HOST }}:8081/repository/npm-group/:_auth" "$authB64"
          npm config set "//${{ secrets.NEXUS_HOST }}:8081/repository/npm-hosted/:_auth" "$authB64"

      - name: Install dependencies and package artifact
        run: |
          npm ci
          npm pack

      # docker/login-action passes the password to docker directly (no PowerShell
      # pipe), so no BOM/encoding bytes get added to it. Registry = host:port, no http://
      - name: Login to Nexus Docker (pull - docker-group 8083)
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.NEXUS_HOST }}:8083
          username: ${{ secrets.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Login to Nexus Docker (push - docker-hosted 8082)
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.NEXUS_HOST }}:8082
          username: ${{ secrets.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push image to Nexus and GHCR (WINDOWS)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tag        = "${{ github.sha }}"
          $owner      = "${{ github.repository_owner }}".ToLower()   # GHCR requires lowercase
          $nexusImage = "${{ secrets.NEXUS_HOST }}:8082/nodejs-poc:$tag"
          $ghcrImage  = "ghcr.io/$owner/nodejs-poc:$tag"

          docker build --build-arg NEXUS_HOST="${{ secrets.NEXUS_HOST }}" -t $nexusImage -t $ghcrImage .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          docker push $nexusImage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          docker push $ghcrImage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }